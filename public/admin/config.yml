backend: { name: github, repo: dangtai061127/dangtai061127.github.io, branch: main }
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: writeups
    label: Writeups
    folder: src/content/writeups
    create: true
    extension: md
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: summary, label: Summary, widget: text }
      - { name: platform, label: Platform, widget: select, required: false, options: [TryHackMe, HackTheBox, BTLO, CTF, Home lab, Other] }
      - { name: difficulty, label: Difficulty, widget: select, required: false, options: [Easy, Medium, Hard, Insane] }
      - { name: category, label: Category, widget: string, required: false }
      - { name: image, label: "Theme image", widget: image, required: false }
      - { name: featured, label: "Featured on home page", widget: boolean, required: false, default: false }
      - { name: tools, label: Tools, widget: list, required: false }
      - { name: mitre, label: "MITRE ATT&CK IDs (e.g. T1059.001)", widget: list, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: "Draft (hidden from site)", widget: boolean, default: true }
      - { name: body, label: Content, widget: markdown }
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    extension: md
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: summary, label: Summary, widget: text }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: "Draft (hidden from site)", widget: boolean, default: true }
      - { name: body, label: Content, widget: markdown }
  - name: profile
    label: Profile
    editor: { preview: false }
    files:
      - name: profile
        label: Profile
        file: src/data/profile.json
        fields:
          - { name: role, label: Role, widget: string }
          - { name: headline, label: Headline, widget: string }
          - { name: lead, label: "Short introduction (home)", widget: text, required: false }
          - { name: intro, label: "Full introduction (About)", widget: text, required: false }
          - { name: cv, label: "CV file", widget: file, required: false }
          - name: links
            label: Links
            widget: object
            fields:
              - { name: linkedin, label: LinkedIn URL, widget: string, required: false, pattern: ['^https://', 'Must start with https://'] }
              - { name: tryhackme, label: TryHackMe URL, widget: string, required: false, pattern: ['^https://', 'Must start with https://'] }
              - { name: btlo, label: BTLO URL, widget: string, required: false, pattern: ['^https://', 'Must start with https://'] }
              - { name: email, label: Email address, widget: string, required: false, pattern: ['^[^@\s:]+@[^@\s]+$','Address only, for example you@example.com'] }
          - name: skills
            label: Skills
            widget: list
            required: false
            fields:
              - { name: name, label: Name, widget: string }
              - { name: tag, label: "Writeup tag that proves it", widget: string }
          - name: achievements
            label: "Achievements (first three show on the home page)"
            widget: list
            required: false
            fields:
              - { name: title, label: Title, widget: string }
              - { name: meta, label: "Issuer and year", widget: string, required: false }
              - { name: url, label: "Verification URL", widget: string, required: false, pattern: ['^https://', 'Must start with https://'] }
          - name: experience
            label: Experience
            widget: list
            required: false
            fields:
              - { name: period, label: Period, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
          - name: activities
            label: Activities
            widget: list
            required: false
            fields:
              - { name: kind, label: Kind, widget: string, required: false }
              - { name: title, label: Title, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
          - name: education
            label: Education
            widget: list
            required: false
            fields:
              - { name: title, label: "School and major", widget: string }
              - { name: detail, label: Detail, widget: string, required: false }
